name: release-please
on:
  push:
    branches:
      - main
permissions: write-all
jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v3
        with:
          release-type: go
#           token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          package-name: release-please-action
          prerelease: true
